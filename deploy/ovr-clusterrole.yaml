---
# Minimum RBAC to run ovr without cluster-admin
# Apply with: oc apply -f examples/ovr-clusterrole.yaml
# Grant with: oc adm policy add-cluster-role-to-user ovr <your-user>
#             oc adm policy add-cluster-role-to-user cluster-monitoring-view <your-user>

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ovr
  labels:
    app.kubernetes.io/name: ovr
rules:
  - apiGroups: ["kubevirt.io"]
    resources:
      - virtualmachines
      - virtualmachineinstances
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources:
      - persistentvolumeclaims
      - namespaces
    verbs: ["get", "list"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources:
      - datavolumes
    verbs: ["get", "list"]
  - apiGroups: ["snapshot.kubevirt.io"]
    resources:
      - virtualmachinesnapshots
    verbs: ["get", "list"]
